[project]
name = "ac-ex"
version = "0.0.0"
description = "workshop step CLI"
requires-python = ">=3.13,<3.14"
dependencies = [
    "ac-core",
    "ac-fixtures",
    "ac-models",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "temporalio>=1.33.0",
    "typer>=0.27.2",
]

[project.scripts]
ex = "ac_ex.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"
