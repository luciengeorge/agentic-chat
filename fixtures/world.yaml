      - {username: peter.hall, name: Peter Hall, title: Former FP&A Analyst, groups: [/Kestrel/Finance/FP&A], enabled: false}
    # A folder's effective sharing = (inherit ? the parent's effective sharing : nothing) + its own
    # grants. The root shares nothing. Roles are read or write.
    folders:
      - {path: /Company, grants: [{group: /Kestrel, role: read}, {user: ella.brooks, role: write}]}
      - {path: /HR, grants: [{group: /Kestrel/HR, role: write}]}
      - {path: /HR/Policies, grants: [{group: /Kestrel, role: read}]}
      - {path: /HR/Casework, inherit: true}
      - {path: /Finance, grants: [{group: /Kestrel/Finance, role: read}, {user: tom.whitfield, role: write}]}
      - {path: /Finance/Reports, grants: [{group: /Kestrel/Exec, role: read}]}
      - {path: /Finance/AP, grants: [{group: /Kestrel/Finance/AP, role: write}]}
      - {path: /Finance/FP&A, inherit: false, grants: [{group: /Kestrel/Finance/FP&A, role: write}, {user: daniel.reyes, role: read}]}
      - {path: /Legal, grants: [{group: /Kestrel/Legal, role: write}]}
      - {path: /Legal/Contracts, grants: [{group: /Kestrel/Finance, role: read}]}
      - {path: /Legal/Regulatory, grants: [{group: /Kestrel/Exec, role: read}]}
      - {path: /Exec, grants: [{group: /Kestrel/Exec, role: write}]}
      - {path: /Engineering, grants: [{group: /Kestrel/Engineering, role: write}]}
      - {path: /Engineering/Runbooks}
      - {path: /Engineering/Incidents}
      - {path: /Sales, grants: [{group: /Kestrel/Sales, role: write}]}
      - {path: /Sales/Playbooks}

