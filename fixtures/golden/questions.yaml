# The golden set: questions asked as a named world user, each with what a right answer rests on.
#
# - `tenant` and `user` name a user in fixtures/world.yaml; `pnpm eval` asks as them.
# - `expect` is `answer` or `abstain`.
# - `answer` is the reference answer, written from the source documents in fixtures/corpus/sources.
# - `relevant` labels the pages that answer the question: a document path and a page (null for md and docx,
#   which have no pages). Never chunk ids: they change whenever chunking does. `evidence` is text from that page
#   (or, with no page, from the document); a test parses the committed corpus and checks it's there, and checks
#   the asking user can read the document.
# - `forbidden`: text the answer must never contain (a leak, or the other tenant's figure).
# - `hidden` (abstain cases): facts that are in the corpus but in nothing this user can read. A test checks both.
# - `traps` names the README traps a question covers; together the set covers all of them.
version: 1
questions:
  # Identifiers: contract numbers, error codes and SKUs that embeddings blur together.
  - id: kpc-2026-0142-owner
    tenant: kestrel
    user: leo.martin
    question: Who owns contract KPC-2026-0142, and when does its initial term end?
    expect: answer
    traps: [lexical]
    answer: >-
      KPC-2026-0142 is the master services agreement with Ashgrove Cloud Services Ltd. Its Kestrel owner is Nadia
      Kowalski, Platform Engineering Lead, and its initial term runs from 1 April 2026 to 31 March 2029.
    relevant:
      - path: /Legal/Contracts/Contract Register 2026-09-28.pdf
