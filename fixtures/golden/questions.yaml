  - id: kp-4031-retry
    tenant: kestrel
    user: sam.patel
    question: What does error KP-4031 mean, and how should the payment be retried?
    expect: answer
    traps: [lexical]
    answer: >-
      KP-4031 (HTTP 402) is a soft decline: the issuer requires Strong Customer Authentication. Retry the same
      payment with 3-D Secure by setting authentication.mode to challenge; a retry without 3-D Secure is declined
      again.
    relevant:
      - path: /Engineering/Runbooks/Payments API Error Code Catalogue.pdf
        page: 3
        evidence: "Soft decline: the issuer requires Strong Customer Authentication"

  - id: kp-9007-wait
    tenant: kestrel
    user: omar.haddad
    question: What HTTP status does KP-9007 return, and how long should a merchant wait before checking the payment?
    expect: answer
    traps: [lexical]
    answer: >-
      KP-9007 returns 504: the acquirer timed out and the outcome is unknown. The merchant must not create a new
      payment; wait 60 seconds, then call GET /v2/payments/{id}. If it is still pending, the final status arrives
      by webhook within 15 minutes. Only retry with the same idempotency key.
    relevant:
      - path: /Engineering/Runbooks/Payments API Error Code Catalogue.pdf
        page: 4
        evidence: "Do not create a new payment. Wait 60 seconds"

