[project]
name = "agentic-chat"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "ac-core",
  "ac-db",
  "ac-models",
  "ac-api",
  "ac-workers",
  "ac-relay",
  "ac-reranker",
  "ac-fake-workspace",
  "ac-ex",
  "ac-fixtures",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "packages/core",
  "packages/db",
  "packages/models",
  "apps/api",
  "apps/workers",
  "apps/relay",
  "apps/reranker",
  "apps/fake_workspace",
  "scripts/ex",
  "packages/fixtures",
]

[tool.uv.sources]
ac-core = { workspace = true }
ac-db = { workspace = true }
ac-models = { workspace = true }
ac-api = { workspace = true }
ac-workers = { workspace = true }
ac-relay = { workspace = true }
ac-reranker = { workspace = true }
ac-fake-workspace = { workspace = true }
ac-ex = { workspace = true }
ac-fixtures = { workspace = true }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["playground", "*.md", "*.mdx"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF", "N", "PT", "RET", "TID"]

[tool.ruff.lint.per-file-ignores]
# Entry points install the slot finder before importing anything else from ac_*.
"**/main.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["ac_*"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
extraPaths = [
  "packages/core/src",
  "packages/db/src",
  "packages/models/src",
  "apps/api/src",
  "apps/workers/src",
  "apps/relay/src",
  "apps/reranker/src",
  "apps/fake_workspace/src",
  "scripts/ex/src",
  "packages/fixtures/src",
]
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "playground"]

[tool.pytest.ini_options]
testpaths = ["packages", "apps", "scripts"]
addopts = ["--import-mode=importlib", "-ra", "-p", "pytester"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["postgres: needs a reachable Postgres at AC_DATABASE_URL"]
