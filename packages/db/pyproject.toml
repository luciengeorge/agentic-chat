[project]
name = "ac-db"
version = "0.0.0"
description = "SQLAlchemy models, Alembic migrations"
requires-python = ">=3.13,<3.14"
dependencies = [
    "ac-core",
    "alembic>=1.20.0",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy[asyncio]>=2.1.1",
]

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
ac-core = { workspace = true }
