# For authoring migrations: `uv run alembic -c packages/db/alembic.ini revision -m "..."`.
# Apps and `ex` run them with `python -m ac_db.migrate`.
[alembic]
script_location = %(here)s/src/ac_db/migrations
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
