[project]
name = "ac-models"
version = "0.0.0"
description = "model provider interface, OpenAI, fakes, cassettes"
requires-python = ">=3.13,<3.14"
dependencies = [
    "ac-core",
    "httpx2>=2.13.1",
    "openai>=3.22.1",
    "pytest>=9.1.1",
]

[project.entry-points.pytest11]
ac_models = "ac_models.pytest_plugin"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
ac-core = { workspace = true }
