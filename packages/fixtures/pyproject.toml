[project]
name = "ac-fixtures"
version = "0.0.0"
description = "the fictional world, realm exports and corpus generators"
requires-python = ">=3.13,<3.14"
dependencies = [
    "ac-core",
    "markdown-it-py>=4.2.0",
    "numpy>=2.5.3",
    "pdfplumber>=0.11.10",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pypdfium2>=5.13.0",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "reportlab>=5.0.1",
]

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
ac-core = { workspace = true }
