admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
    - name: public
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: public
                use_remote_address: true
                generate_request_id: true
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                route_config:
                  name: public
                  virtual_hosts:
                    - name: api
                      domains: ["*"]
                      routes:
                        - match: { path: /health }
                          route: { cluster: api }
                        # SSE (section 11). It goes above /v1/ and reuses its rate_limits. Envoy checks
                        # the JWT at request start only. idle_timeout overrides the listener's
                        # stream_idle_timeout for this route; keep it well above the 15s heartbeat.
                        # - match: { safe_regex: { regex: "^/v1/runs/[^/]+/events$" } }
                        #   route:
                        #     cluster: api
                        #     timeout: 0s
                        #     idle_timeout: 3600s
                        - match: { prefix: /v1/ }
                          route:
                            cluster: api
                            rate_limits:
                              - actions:
                                  - metadata:
                                      descriptor_key: sub
                                      source: DYNAMIC
                                      metadata_key:
                                        key: envoy.filters.http.jwt_authn
                                        path: [{ key: jwt_payload }, { key: sub }]
                http_filters:
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        kestrel:
                          issuer: http://localhost:8081/realms/kestrel
                          audiences: [agentic-api]
                          remote_jwks:
                            http_uri:
                              uri: http://keycloak:8080/realms/kestrel/protocol/openid-connect/certs
                              cluster: keycloak
                              timeout: 5s
                            cache_duration: 60s
                            async_fetch: {}
                          forward_payload_header: x-jwt-payload
                          payload_in_metadata: jwt_payload
                        harbour:
                          issuer: http://localhost:8081/realms/harbour
                          audiences: [agentic-api]
                          remote_jwks:
                            http_uri:
                              uri: http://keycloak:8080/realms/harbour/protocol/openid-connect/certs
                              cluster: keycloak
                              timeout: 5s
                            cache_duration: 60s
                            async_fetch: {}
                          forward_payload_header: x-jwt-payload
                          payload_in_metadata: jwt_payload
                      rules:
                        - match: { prefix: /v1/ }
                          requires:
                            requires_any:
                              requirements:
                                - provider_name: kestrel
                                - provider_name: harbour
                  - name: envoy.filters.http.ratelimit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ratelimit.v3.RateLimit
                      domain: agentic-api
                      enable_x_ratelimit_headers: DRAFT_VERSION_03
                      rate_limit_service:
                        transport_api_version: V3
                        grpc_service:
                          envoy_grpc: { cluster_name: ratelimit }
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: api
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: api
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: api, port_value: 8000 } } }

    - name: keycloak
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: keycloak
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: keycloak, port_value: 8080 } } }

    - name: ratelimit
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: ratelimit
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: ratelimit, port_value: 8081 } } }
