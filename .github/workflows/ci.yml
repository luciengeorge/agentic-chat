name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      paradedb:
        image: paradedb/paradedb:0.26.1-pg18
        env:
          POSTGRES_USER: ac
          POSTGRES_PASSWORD: ac
          POSTGRES_DB: ac
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U ac -d ac"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      AC_ENV: test
      AC_REQUIRE_POSTGRES: "1"
      # The app role (row-level security binds it); tests give it this password. The owner runs migrations.
      DATABASE_URL: postgres://ac_app:ac_app@localhost:5432/ac
      DATABASE_ADMIN_URL: postgres://ac:ac@localhost:5432/ac
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:check
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # src/server/production-build.test.ts makes the same checks; this runs them on the artifact CI built.
      # env -i drops the job's AC_ENV=test: a deploy that sets nothing must come up as prod.
      - name: The production build fails closed
        run: |
          run=(timeout 60 env -i PATH="$PATH" PORT=3001 WORKFLOW_LOCAL_DATA_DIR="$RUNNER_TEMP/world")
          if "${run[@]}" node .output/server/index.mjs > missing.log 2>&1; then
            cat missing.log; echo "it started with nothing set"; exit 1
          fi
          grep -q "  CRON_SECRET: " missing.log || { cat missing.log; exit 1; }
          set_all=(DATABASE_URL="$DATABASE_URL" DATABASE_ADMIN_URL="$DATABASE_ADMIN_URL"
            BETTER_AUTH_URL=http://localhost:3001 CRON_SECRET="$(openssl rand -hex 32)"
            OPENAI_API_KEY=unused-in-ci COHERE_API_KEY=unused-in-ci)
          if "${run[@]}" "${set_all[@]}" BETTER_AUTH_SECRET=dev-better-auth-secret-not-for-production \
            TOAST_SECRET=dev-toast-secret-not-for-production-use node .output/server/index.mjs > refused.log 2>&1; then
            cat refused.log; echo "it started on the dev secrets"; exit 1
          fi
          grep -q "BETTER_AUTH_SECRET must be set to a real secret" refused.log || { cat refused.log; exit 1; }
          "${run[@]}" "${set_all[@]}" BETTER_AUTH_SECRET="$(openssl rand -hex 32)" TOAST_SECRET="$(openssl rand -hex 32)" \
            node .output/server/index.mjs > served.log 2>&1 &
          server=$!
          for _ in $(seq 100); do curl -s -o /dev/null http://localhost:3001/ && break; sleep 0.2; done
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{}' http://localhost:3001/api/spike)
          cron=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/api/cron/relay)
          kill "$server"
          test "$status" = 404 || { cat served.log; echo "POST /api/spike answered $status, not 404"; exit 1; }
          test "$cron" = 401 || { cat served.log; echo "GET /api/cron/relay without the secret answered $cron, not 401"; exit 1; }
      - run: pnpm ex gate
