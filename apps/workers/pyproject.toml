[project]
name = "ac-workers"
version = "0.0.0"
description = "Temporal workers"
requires-python = ">=3.13,<3.14"
dependencies = [
    "ac-core",
    "fastapi>=0.142.2",
    "temporalio>=1.33.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
ac-core = { workspace = true }
