[project]
name = "ac-reranker"
version = "0.0.0"
description = "sentence-transformers service with TEI /rerank schema"
requires-python = ">=3.13,<3.14"
dependencies = [
    "ac-core",
    "fastapi>=0.142.2",
    "sentence-transformers>=6.1.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
ac-core = { workspace = true }
