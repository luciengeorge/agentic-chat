services:
  paradedb:
    image: paradedb/paradedb:0.26.1-pg18
    environment:
      POSTGRES_USER: ac
      POSTGRES_PASSWORD: ac
      POSTGRES_DB: ac
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - paradedb-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ac -d ac"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  paradedb-data:
