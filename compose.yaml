services:
  paradedb:
    image: paradedb/paradedb:0.26.1-pg18
    environment:
      POSTGRES_USER: ac
      POSTGRES_PASSWORD: ac
      POSTGRES_DB: ac
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - paradedb-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ac -d ac"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The production parser that section 03 compares ours against (scripts/parse-compare.ts). About
  # 4.4 GB, so it only starts with `docker compose --profile docling up -d docling`.
  docling:
    image: quay.io/docling-project/docling-serve-cpu:v1.35.0
    profiles: [docling]
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      DOCLING_SERVE_ENABLE_UI: "0"

volumes:
  paradedb-data:
