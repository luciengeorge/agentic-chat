services:
  paradedb:
    image: paradedb/paradedb:0.26.1-pg18
    environment:
      POSTGRES_USER: ac
      POSTGRES_PASSWORD: ac
      POSTGRES_DB: ac
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - paradedb-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ac -d ac"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The production parser that section 03 compares ours against (scripts/parse-compare.ts). About
  # 4.4 GB, so it only starts with `docker compose --profile docling up -d docling`.
  docling:
    image: quay.io/docling-project/docling-serve-cpu:v1.35.0
    profiles: [docling]
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      DOCLING_SERVE_ENABLE_UI: "0"

  # Grafana, Tempo (traces), Prometheus (metrics) and Loki (logs) behind one OpenTelemetry collector, for section 19.
  # Only with `docker compose --profile observability up -d otel-lgtm`. The app sends to it when
  # OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318; Grafana is on http://localhost:3001 (admin/admin), since the
  # app has :3000.
  otel-lgtm:
    image: grafana/otel-lgtm:0.37.0
    profiles: [observability]
    ports:
      - "127.0.0.1:3001:3000"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"

  # Section 21: a network with no route out. `internal: true` gives it no gateway, so nothing on it reaches the
  # internet, the host or its LAN, and Docker publishes no ports from it. `pnpm local:egress-check` runs the probe
  # (fixtures/local/egress-probe.sh), which tries OpenAI, Cohere, Hugging Face, bare IPs and the host, and must
  # reach only airgap-db. Both use the paradedb image, so the profile pulls nothing:
  # `docker compose --profile airgap run --rm airgap-probe`.
  airgap-db:
    image: paradedb/paradedb:0.26.1-pg18
    profiles: [airgap]
    environment:
      POSTGRES_USER: ac
      POSTGRES_PASSWORD: ac
      POSTGRES_DB: ac
    networks: [airgap]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ac -d ac"]
      interval: 2s
      timeout: 5s
      retries: 30

  airgap-probe:
    image: paradedb/paradedb:0.26.1-pg18
    profiles: [airgap]
    networks: [airgap]
    depends_on:
      airgap-db:
        condition: service_healthy
    entrypoint: ["bash", "/probe/egress-probe.sh"]
    volumes:
      - ./fixtures/local/egress-probe.sh:/probe/egress-probe.sh:ro

networks:
  airgap:
    internal: true

volumes:
  paradedb-data:
